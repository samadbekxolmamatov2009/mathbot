<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sozlamalar</title>
<link rel="stylesheet" href="/style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="formState">

    <div class="header">
      <h1>📊 Haftalik hisobot</h1>
      <p>Belgilangan kun/vaqtda, oxirgi hisobotdan keyin topshirilgan barcha test natijalari asosida PDF avtomatik kanalga yuboriladi.</p>
    </div>

    <div class="time-field">
      <div class="settings-row">
        <label class="settings-label" for="reportEnabledToggle">Faollashtirish</label>
        <label class="switch">
          <input type="checkbox" id="reportEnabledToggle" />
          <span class="switch-slider"></span>
        </label>
      </div>
    </div>

    <div class="time-field">
      <label>Qaysi kuni</label>
      <div class="day-picker" id="reportDayPicker">
        <button type="button" class="day-btn" data-day="0">Dush</button>
        <button type="button" class="day-btn" data-day="1">Sesh</button>
        <button type="button" class="day-btn" data-day="2">Chor</button>
        <button type="button" class="day-btn" data-day="3">Pay</button>
        <button type="button" class="day-btn" data-day="4">Juma</button>
        <button type="button" class="day-btn" data-day="5">Shan</button>
        <button type="button" class="day-btn" data-day="6">Yak</button>
      </div>
    </div>

    <div class="time-field">
      <label>Soat</label>
      <div class="time-picker">
        <select id="reportHourSelect"></select>
        <span class="time-sep">:</span>
        <select id="reportMinuteSelect"></select>
      </div>
    </div>

    <div class="settings-status" id="reportStatusLine"></div>

    <button type="button" id="saveBtn" class="save-btn">💾 Saqlash</button>
  </div>

  <div id="successState" style="display:none">
    <div class="result-card">
      <p>✅ Sozlamalar saqlandi</p>
    </div>
  </div>

  <script src="/settings.js?v=4"></script>
</body>
</html>
