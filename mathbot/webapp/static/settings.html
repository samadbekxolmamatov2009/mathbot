<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sozlamalar</title>
<link rel="stylesheet" href="/style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="formState">
    <div class="header">
      <h1>⚙️ Haftalik xabar rejasi</h1>
      <p>Belgilangan kun va vaqtda barcha ro'yxatdan o'tgan o'quvchilarga xabar avtomatik yuboriladi.</p>
    </div>

    <div class="time-field">
      <div class="settings-row">
        <label class="settings-label" for="enabledToggle">Faollashtirish</label>
        <label class="switch">
          <input type="checkbox" id="enabledToggle" checked />
          <span class="switch-slider"></span>
        </label>
      </div>
    </div>

    <div class="time-field">
      <label for="messageText">Xabar matni</label>
      <textarea id="messageText" rows="5" placeholder="Masalan: Assalomu alaykum! Bugun soat 18:00 da darsimiz bo'ladi."></textarea>
    </div>

    <div class="time-field">
      <label>Qaysi kuni</label>
      <div class="day-picker" id="dayPicker">
        <button type="button" class="day-btn" data-day="0">Dush</button>
        <button type="button" class="day-btn" data-day="1">Sesh</button>
        <button type="button" class="day-btn" data-day="2">Chor</button>
        <button type="button" class="day-btn" data-day="3">Pay</button>
        <button type="button" class="day-btn" data-day="4">Juma</button>
        <button type="button" class="day-btn" data-day="5">Shan</button>
        <button type="button" class="day-btn" data-day="6">Yak</button>
      </div>
    </div>

    <div class="time-field">
      <label>Soat</label>
      <div class="time-picker">
        <select id="hourSelect"></select>
        <span class="time-sep">:</span>
        <select id="minuteSelect"></select>
      </div>
    </div>

    <div class="settings-status" id="statusLine"></div>
  </div>

  <div id="successState" style="display:none">
    <div class="result-card">
      <p>✅ Sozlamalar saqlandi</p>
    </div>
  </div>

  <script src="/settings.js?v=1"></script>
</body>
</html>
